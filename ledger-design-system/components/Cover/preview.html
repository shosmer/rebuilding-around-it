<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { color:var(--ink); font-family:var(--font-sans); overflow:hidden;
    background: radial-gradient(60% 50% at 85% 0%, var(--page-glow), transparent 70%), linear-gradient(180deg, var(--page-top), var(--page-bottom)); }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .cover::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:multiply; background-size:240px 240px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.098 0 0 0 0 0.094 0 0 0 0 0.082 0 0 0 1 0'/></filter><rect width='240' height='240' filter='url(%23g)'/></svg>"); }
  [data-theme="dark"] .cover::before { opacity:.07; mix-blend-mode:screen;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.965 0 0 0 0 0.957 0 0 0 0 0.937 0 0 0 1 0'/></filter><rect width='240' height='240' filter='url(%23g)'/></svg>"); }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; overflow:visible; }
  .accent { fill:url(#gAccent); }
  .deep { fill:var(--surface-inverse); }
  .ochre { fill:url(#gOchre); }
  .card { fill:url(#gCard); stroke:var(--line-1); stroke-width:var(--stroke-hair); }
  .bar { fill:url(#gBar); rx:var(--radius-sm); }
  .bar.muted { fill:var(--series-muted); }
  .axis { stroke:var(--line-2); stroke-width:var(--stroke-axis); }
  .blk { rx:var(--radius-lg); }
  .hero { rx:var(--radius-xl); }
  .shadow { filter:drop-shadow(0 16px 24px rgba(25,24,21,.28)); }
  [data-theme="dark"] .shadow { filter:drop-shadow(0 16px 24px rgba(0,0,0,.7)); }
  .glow { filter:drop-shadow(0 6px 14px var(--accent-glow)); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.9; font-weight:500; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 var(--space-1); font-size:14px; line-height:20px; color:var(--ink-3); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent gradient (accent-deep → accent, 135deg) 176×208 bled off the top, radius-xl: the hero panel · surface-inverse 300×216 bleeding off the right edge: the masthead · series-2 gradient 64×48 bled off the top: last year, small · a card (card-top → card-bottom, line-1 edge, shadow-card) 176×56 as the tint — ≈40% of 960×288
  arrangement one tall accent slab left of the box, the deep masthead slab bleeding right, bottoms on one line space-6 above the edge, space-4 gutters; the slabs carry shadow-card so they rest on the page the way the cards do
  pattern     thin bars anchored to a baseline, from the Charts rule "series-1-deep at the baseline to series-1 at the free end, radius-sm on the free end, the highlighted bar glows": four bar-thickness bars on the masthead, the top one in the series-1 gradient with shadow-glow, the rest series-muted, the stroke-axis baseline in line-2
  scales      slab sides in space-4 multiples (176, 208, 216, 300); gutters space-4; bar height bar-thickness (24), bar gap space-2 (8); corners radius-xl on the hero slab, radius-lg on the others, radius-sm on bar ends
-->
<defs>
  <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent-deep)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient>
  <linearGradient id="gOchre" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--series-2-deep)"/><stop offset="1" stop-color="var(--series-2)"/></linearGradient>
  <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--card-top)"/><stop offset="1" stop-color="var(--card-bottom)"/></linearGradient>
  <linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--series-1-deep)"/><stop offset="1" stop-color="var(--series-1)"/></linearGradient>
</defs>
<g class="shadow">
<rect class="accent hero" x="16" y="-16" width="176" height="208"/>
<rect class="card blk" x="16" y="208" width="176" height="56"/>
<rect class="ochre blk" x="208" y="-16" width="64" height="48"/>
<rect class="deep blk" x="208" y="48" width="300" height="216"/>
</g>
<line class="axis" x1="240" y1="80" x2="240" y2="232"/>
<rect class="bar glow" x="240" y="88" width="192" height="24"/>
<rect class="bar muted" x="240" y="120" width="72" height="24"/>
<rect class="bar muted" x="240" y="152" width="136" height="24"/>
<rect class="bar muted" x="240" y="184" width="40" height="24"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Ledger</h1>
  <p class="tag">A data-forward Astryx theme for survey evidence, from the design team to the regulator.</p>
</div>
</div>
</body>
</html>
