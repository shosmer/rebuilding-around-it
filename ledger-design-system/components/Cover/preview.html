<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface-0); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .accent { fill:var(--accent); }
  .deep { fill:var(--surface-inverse); }
  .ochre { fill:var(--series-2); }
  .tint { fill:var(--series-muted); }
  .cut { fill:var(--surface-0); }
  .blk { rx:var(--radius-lg); }
  .bar { rx:var(--radius-sm); }
  .axis { stroke:var(--line-2); stroke-width:var(--stroke-axis); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.9; font-weight:500; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 var(--space-1); font-size:14px; line-height:20px; color:var(--ink-3); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 176×208 bled off the top (the one hue the system has) · surface-inverse 288×216 bleeding off the right edge (the masthead ink) · series-2 ochre 64×48 bled off the top (the comparison series, small: it only ever means "last year") · series-muted 176×56 as the tint — ≈40% of 960×288
  arrangement one tall accent slab left of the box, a deep inverse slab bleeding right, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     thin bars anchored to a baseline, from the Charts rule "thin marks, square at the baseline, radius-sm on the free end": four bar-thickness bars cut from the ground into the inverse slab, with the stroke-axis baseline in line-2; the one shape a Ledger reader sees on every page
  scales      slab widths and heights in space-4 multiples (176 = 11×16, 208 = 13×16, 216 = 13.5×16 → bottoms aligned at 264 = 288 − space-6); gutters space-4; bar height bar-thickness (20), bar gap space-3 (12); corners radius-lg on blocks, radius-sm on bar ends
-->
<rect class="accent blk" x="16" y="-16" width="176" height="208"/>
<rect class="tint blk" x="16" y="208" width="176" height="56"/>
<rect class="ochre blk" x="208" y="-16" width="64" height="48"/>
<rect class="deep blk" x="208" y="48" width="300" height="216"/>
<line class="axis" x1="240" y1="80" x2="240" y2="232"/>
<rect class="cut bar" x="240" y="88" width="192" height="20"/>
<rect class="cut bar" x="240" y="120" width="72" height="20"/>
<rect class="cut bar" x="240" y="152" width="136" height="20"/>
<rect class="cut bar" x="240" y="184" width="40" height="20"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Ledger</h1>
  <p class="tag">A data-forward Astryx theme for survey evidence, from the design team to the regulator.</p>
</div>
</div>
</body>
</html>
